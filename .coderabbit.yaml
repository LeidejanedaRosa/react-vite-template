# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  auto_review:
    base_branches:
      - '.*'
  path_instructions:
    - path: '{package.json,pnpm-lock.yaml}'
      instructions: 'O CI roda `pnpm install --frozen-lockfile`, que falha se o pnpm-lock.yaml não bater com o package.json. Não pedir para verificar se o lockfile está sincronizado: o CI já garante isso.'
