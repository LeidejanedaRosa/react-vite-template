<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Tags -->
    <title>Your Company - Main Tagline</title>
    <meta
      name="description"
      content="A brief description of your company or project. This will be used in meta descriptions and SEO. Keep it between 150-160 characters."
    />
    <meta
      name="keywords"
      content="keyword1, keyword2, keyword3, your industry, your service"
    />
    <meta name="author" content="Your Company Name" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.yourcompany.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.yourcompany.com/" />
    <meta property="og:title" content="Your Company - Main Tagline" />
    <meta
      property="og:description"
      content="A brief description of your company or project. This will be used in meta descriptions and SEO."
    />
    <meta
      property="og:image"
      content="https://www.yourcompany.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Your Company - Preview Image" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Your Company Name" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.yourcompany.com/" />
    <meta name="twitter:title" content="Your Company - Main Tagline" />
    <meta
      name="twitter:description"
      content="A brief description of your company or project. This will be used in meta descriptions and SEO."
    />
    <meta
      name="twitter:image"
      content="https://www.yourcompany.com/og-image.jpg"
    />
    <meta name="twitter:image:alt" content="Your Company - Preview Image" />
    <!-- <meta name="twitter:site" content="@yourcompany" /> -->
    <!-- <meta name="twitter:creator" content="@yourcompany" /> -->

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color (browser toolbar) -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- Preconnect to external domains (performance) -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->

    <!-- DNS Prefetch for analytics/third-party services -->
    <!-- <link rel="dns-prefetch" href="https://www.googletagmanager.com" /> -->

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.yourcompany.com/#website",
            "name": "Your Company Name",
            "url": "https://www.yourcompany.com",
            "description": "A brief description of your company or project.",
            "publisher": {
              "@id": "https://www.yourcompany.com/#organization"
            },
            "inLanguage": "pt-BR"
          },
          {
            "@type": "Organization",
            "@id": "https://www.yourcompany.com/#organization",
            "name": "Your Company Name",
            "legalName": "Your Company Legal Name",
            "url": "https://www.yourcompany.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.yourcompany.com/logo.svg",
              "width": 200,
              "height": 60
            },
            "description": "A brief description of your company or project.",
            "foundingDate": "2024",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "BR",
              "addressRegion": "SP",
              "addressLocality": "Your City"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+55-11-99999-9999",
              "email": "contact@yourcompany.com",
              "contactType": "customer service",
              "availableLanguage": ["Portuguese"]
            },
            "sameAs": [
              "https://www.instagram.com/yourcompany/",
              "https://www.linkedin.com/company/yourcompany/",
              "https://www.facebook.com/yourcompany/"
            ]
          }
        ]
      }
    </script>

    <!-- Additional SEO: Geo Tags (if location-specific) -->
    <!-- <meta name="geo.region" content="BR-SP" /> -->
    <!-- <meta name="geo.placename" content="São Paulo" /> -->

    <!-- Additional SEO: Language/Locale Alternates -->
    <!-- <link rel="alternate" hreflang="pt-BR" href="https://www.yourcompany.com/" /> -->
    <!-- <link rel="alternate" hreflang="en" href="https://www.yourcompany.com/en/" /> -->
    <!-- <link rel="alternate" hreflang="x-default" href="https://www.yourcompany.com/" /> -->
  </head>
  <body>
    <!-- Skip Navigation Link (Accessibility) -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 focus:z-50 focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2"
    >
      Pular para o conteúdo principal
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
