# SonarCloud. Organização e chave do projeto não ficam aqui: o CI deriva as duas do nome do
# repositório (padrão do SonarCloud ao importar do GitHub: dono em minúsculas / Dono_repo), para
# um projeto criado a partir do template não mandar a análise para o projeto do template.
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/types/**,src/vite-env.d.ts
sonar.coverage.exclusions=src/main.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
